@version: 4.8
@include "scl.conf"

options {
  keep-hostname(yes);
  chain-hostnames(no);
  use-dns(no);
  use-fqdn(no);
  log-msg-size(65536);
  stats(freq(0));
  create-dirs(yes);
  dir-perm(0750);
  perm(0640);
};

# ---------- Приём ----------
source s_net {
  network(transport("udp") port(514) so-rcvbuf(33554432));
  network(transport("tcp") port(514) max-connections(500));
  # RFC5424 (в т.ч. от rsyslog/Linux)
  syslog(transport("tcp") port(601) flags(syslog-protocol));
};

# ---------- Файловый архив (ротация по дням, чистка: scripts/archive-maintenance.sh) ----------
destination d_archive {
  file("/var/log/remote/${HOST}/${YEAR}-${MONTH}-${DAY}.log"
       template("${ISODATE} ${HOST} ${PROGRAM}[${PID}]: ${MESSAGE}\n"));
};

# ---------- Отправка в Alloy (RFC5424/TCP) с дисковым буфером ----------
destination d_alloy {
  syslog("alloy" transport("tcp") port(1514)
    disk-buffer(
      mem-buf-size(10000000)
      disk-buf-size(2147483648)
      reliable(yes)
      dir("/var/lib/syslog-ng")
    )
  );
};

log {
  source(s_net);
  destination(d_archive);
  destination(d_alloy);
};
